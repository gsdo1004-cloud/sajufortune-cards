name: 띠별운세 자동발행 (카드뉴스 + 릴스 · 새벽)

on:
  schedule:
    # 2026-07-21: KST 00:02 → 21:00 으로 이동. 한밝님이 쓰레드를 켜고 있는 저녁 시간대에
    # 발행해야 노출이 잘 됨. 재료(카드+영상)는 전날 18:00 로컬 파이프라인이 이미 push 해둠 →
    # 당일 21시엔 그날치가 이미 존재. GitHub Actions cron 지연 감안 21~22시 실행.
    # (UTC 11:00 = KST 20:00 당일 — TZ=Asia/Seoul 로 날짜를 뽑으므로 날짜 경계 문제 없음)
    #
    # [2026-08-07] 한밝님 지시: '오늘의 운세'는 전날 저녁 20~24시에 올린다.
    # 예정 21:00 일 때 실측 착지가 21:56~23:15 (지연 56분~2h15m) 로 창 상단이 빠듯했다.
    # 지연이 3시간으로만 튀어도 자정을 넘겨 '전날 업로드'가 깨지고, 유튜브 publishAt
    # (D+1 00:00) 도 과거 시각이 돼 즉시 공개로 새어 나간다. 예정을 20:00 으로 당겨
    # 착지를 20:56~22:15 로 만들어 창 한가운데에 놓는다.
    #
    # [2026-08-07] 정각(:00) → :23. 같은 날 유령글이 정각 혼잡으로 통째로 누락된 뒤
    # 세 워크플로 모두 분을 어긋나게 뒀다. 자세한 근거는 zodiac-ghost.yml 주석 참조.
    # 명목 20:23 + 지연이면 착지가 21시 전후 — 20~24시 창 한가운데를 유지한다.
    - cron: '23 11 * * *'    # KST 20:23
  workflow_dispatch:
    inputs:
      offset_days:
        description: '발행 대상 날짜 오프셋 (0=오늘, 1=내일, 2=모레). 비우면 2'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      # 21시 실행은 '다음날(D+1)' 운세를 올린다 (2026-07-30 한밝님 지시로 D+2 → D+1).
      # 자정이 지나면 그날 운세가 이미 계정에 있고, 계정에 뜬 날짜가 실제 날짜와 하루만
      # 어긋난다. D+2 는 "하루치 여유" 목적이었지만 대가가 컸다 — 21시에 올라간 글이
      # 모레 운세라 독자가 보는 날짜와 이틀 벌어졌고, 7/28~29 push 장애 때는 그 여유가
      # 오히려 '어느 날짜가 비었는지' 파악을 어렵게 했다.
      # 재고 여유는 그대로다: 집PC 파이프라인(18:00)이 D+2 기준으로 만들어 두므로
      # D+1 치는 이미 이틀 전에 생성돼 커밋된 상태다.
      # 수동 실행(workflow_dispatch)에서 offset_days 를 주면 그 값이 우선한다.
      # 예: 오늘치를 메워야 하면 0, 모레치를 미리 올리려면 2.
      ZODIAC_PUBLISH_OFFSET_DAYS: ${{ github.event.inputs.offset_days || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 폰트·ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji ffmpeg

      # 2026-08-05: Supertonic 모델(약 400MB)은 첫 실행에만 받고 이후 캐시를 쓴다.
      # 리포에 넣을 수 없는 크기라(단일 파일 244MB > 100MB 한도) HF에서 받는다.
      - name: Supertonic 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic3-model-v1

      - name: 의존성 설치
        run: |
          pip install requests playwright edge-tts supertonic google-api-python-client google-auth-oauthlib google-auth-httplib2 Pillow
          python -m playwright install --with-deps chromium

      # 2026-07-17: 집 PC 새벽 파이프라인이 Topview GPT Image 2 카드 5장 + 타입캐스트
      # 쇼츠를 미리 커밋해둠 → 있으면 그대로 발행(레거시 생성 건너뜀), 없으면(PC 꺼짐·
      # 생성 실패) 기존 HTML 카드 + Edge TTS 릴스로 폴백 — 발행은 어떤 경우에도 나간다.
      # 2026-08-05 — 카드 생성을 러너 안으로 들여왔다(배경 템플릿 + PIL).
      # 이전에는 집 PC 18시 스케줄이 Topview 로 만들어 커밋해 뒀고 여기서는 건너뛰기만 했다.
      # 이제 이미지 생성 API 를 쓰지 않으므로 러너가 직접 만든다 — 크레딧 0, 집 PC 불필요.
      # 집 PC 가 만들어 둔 재고(png)가 있으면 그대로 존중한다(전환기 안전망).
      # [2026-08-07] 생성 날짜를 발행 날짜에 맞춘다.
      # 이 잡은 '내일치'를 발행하는데(ZODIAC_PUBLISH_OFFSET_DAYS=1) 생성 가드만
      # 오프셋 없는 '오늘'을 보고 있었다. 집 PC 파이프라인이 D+1 버퍼를 미리
      # 커밋해 주던 동안에는 가려져 있었지만, 그게 08-06 은퇴하면서 드러났다 —
      # 오늘치가 이미 있으면 생성을 건너뛰고, 정작 발행 대상인 내일치는 없어서
      # 캐러셀·릴스·유튜브가 모두 빈손이 된다. 아래 유튜브 스텝과 같은 식으로 맞춘다.
      - name: 카드 생성 (기존 커밋분 있으면 건너뜀)
        run: |
          TARGET=$(TZ=Asia/Seoul date -d "+${ZODIAC_PUBLISH_OFFSET_DAYS:-0} days" +%F)
          N=$(ls cards/$TARGET/card_*.png cards/$TARGET/card_*.jpg 2>/dev/null | wc -l)
          if [ "$N" -ge 5 ]; then
            echo "카드 ${N}장 존재($TARGET) — 생성 건너뜀"
          else
            python zodiac_cardnews_tpl.py generate "$TARGET"
          fi

      - name: 릴스 영상 생성 (커밋분 있으면 건너뜀)
        env:
          # 2026-08-05: 아바타 자산을 avatar/ 에 번들했으므로 러너에서도 켠다.
          # 자산이나 ffmpeg가 없으면 avatar_pip 이 알아서 건너뛰므로 발행은 안 멈춘다.
          ZODIAC_AVATAR: "1"
          SUPERTONIC_VOICE: "M2"
        run: |
          # 가드도 발행 대상(D+1)을 봐야 한다 — 위 '카드 생성' 스텝과 같은 이유.
          # zodiac_reels.py generate 는 인자가 없으면 zs.target_iso() = 오늘+오프셋을
          # 만들므로, 가드만 오늘을 보면 만들 파일과 확인할 파일이 하루 어긋난다.
          TARGET=$(TZ=Asia/Seoul date -d "+${ZODIAC_PUBLISH_OFFSET_DAYS:-0} days" +%F)
          if [ -s "reels/${TARGET}_tts.mp4" ]; then
            echo "쇼츠 영상 존재($TARGET) — 레거시 릴스 생성 건너뜀"
          else
            python zodiac_reels.py generate
          fi

      - name: 커밋 (카드+릴스 public raw 호스팅)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ reels/
          git commit -m "cards+reel $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push

      - name: raw URL 전파 대기
        run: sleep 30

      # [2026-08-06] 유튜브 운명과학TV 예약발행.
      # 집 PC 의 zodiac_daily_pipeline 이 8/6 부로 은퇴하면서 유튜브 발행 경로가
      # 통째로 끊겼다. 영상은 위에서 이미 만들었으므로 새로 만들지 않고 그대로 올린다.
      # 항상 private + publishAt(다음 00시) — 올라가자마자 공개되면 되돌릴 틈이 없다.
      #
      # 스위치로 둔 이유: 쓰레드·인스타 쪽은 제재 이력이 있어 발행을 멈춰야 할 때가
      # 오는데, 그때 유튜브까지 같이 죽이거나 반대로 유튜브만 급히 끄려면 코드를
      # 고쳐야 한다. 변수 하나로 끊을 수 있게 해 둔다.
      # ▶ 제어: 레포 Settings → Secrets and variables → Actions → Variables 탭의
      #    YOUTUBE_UNMYEONG_ENABLED (1=발행, 그 외=보류). 코드는 건드릴 필요 없다.
      - name: 유튜브 예약발행 (운명과학TV)
        id: youtube_reservation
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_UNMYEONG: ${{ secrets.YOUTUBE_TOKEN_UNMYEONG }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_UNMYEONG_ENABLED: ${{ vars.YOUTUBE_UNMYEONG_ENABLED }}
        run: |
          if [ "${YOUTUBE_UNMYEONG_ENABLED}" != "1" ]; then
            echo "유튜브 발행 보류 중(YOUTUBE_UNMYEONG_ENABLED != 1) — 건너뜁니다."
            exit 0
          fi
          # 쓰레드 발행과 같은 날짜를 봐야 한다. 이 잡은 21시에 '내일치'를 내보내므로
          # (zodiac_seo 가 ZODIAC_PUBLISH_OFFSET_DAYS 를 읽는다) 여기서도 같은 오프셋을
          # 적용한다. date +%F 로 오늘을 집으면 하루 지난 운세가 올라간다.
          OFFSET="${ZODIAC_PUBLISH_OFFSET_DAYS:-0}"
          TODAY=$(TZ=Asia/Seoul date -d "+${OFFSET} days" +%F)
          echo "대상 날짜: $TODAY (offset +${OFFSET})"
          VIDEO="reels/${TODAY}_tts.mp4"
          if [ ! -s "$VIDEO" ]; then
            echo "영상 없음($VIDEO) — 유튜브 업로드 건너뜀"; exit 0
          fi
          if [ -f "cards/${TODAY}/uploaded.json" ] || [ -f "cards/${TODAY}/youtube_pub.json" ]; then
            echo "이미 업로드됨(멱등 가드) — 건너뜀"; exit 0
          fi
          python - "$TODAY" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          import zodiac_reels as zr
          day = sys.argv[1]
          m = zr.youtube_meta(day)
          # 대상일 전날 21:00에 공개한다. 로컬 파이프라인이 먼저 예약한 경우에는
          # uploaded.json 멱등 표식으로 건너뛴다.
          from datetime import date, timedelta
          publish_day = date.fromisoformat(day) - timedelta(days=1)
          r = subprocess.run([sys.executable, "youtube_upload.py",
                              "--file", f"reels/{day}_tts.mp4",
                              "--title", m["title"],
                              "--description", m["description"],
                              "--tags", ",".join(m["tags"]),
                              "--publish-at", f"{publish_day}T21:00:00+09:00",
                              "--slot-hours", "0"])
          if r.returncode == 0:
              p = Path("cards") / day / "youtube_pub.json"
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps({"uploaded": True}, ensure_ascii=False), encoding="utf-8")
          sys.exit(r.returncode)
          PY

      # 유튜브 예약 완료 전에는 Threads를 절대 발행하지 않는다.
      # 로컬 파이프라인의 uploaded.json 또는 이 워크플로의 youtube_pub.json이 필요하다.
      - name: Threads 발행 선행조건 확인
        id: threads_gate
        run: |
          OFFSET="${ZODIAC_PUBLISH_OFFSET_DAYS:-0}"
          TARGET=$(TZ=Asia/Seoul date -d "+${OFFSET} days" +%F)
          if [ -f "cards/${TARGET}/uploaded.json" ] || [ -f "cards/${TARGET}/youtube_pub.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "유튜브 예약 완료 확인: ${TARGET}"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "유튜브 예약 표식 없음 — Threads 발행 보류: ${TARGET}"
          fi

      - name: 스레드 카드뉴스 캐러셀 발행
        if: steps.threads_gate.outputs.ready == 'true'
        continue-on-error: true
        run: python zodiac_cardnews.py publish

      - name: 스레드 릴스 영상 발행
        if: steps.threads_gate.outputs.ready == 'true'
        continue-on-error: true
        run: python zodiac_reels.py publish

      # [2026-07-30] 멱등 마커를 원격에 남긴다.
      # zodiac_cardnews/reels 는 발행 후 cards/{날짜}/threads_pub_*.json 을 쓰고,
      # 다음 실행에서 그 파일이 있으면 스킵한다. 그런데 위의 커밋 스텝은 발행 '전'에만
      # 돌기 때문에 마커가 커밋되지 않았고, runner 는 매번 새로 체크아웃하므로
      # 가드가 사실상 무효였다(원격 마커가 2026-07-21 까지만 남아 있던 이유).
      # 재실행·중복 발행을 진짜로 막으려면 발행 뒤에 한 번 더 커밋해야 한다.
      - name: 발행 마커 커밋 (재실행 중복 방지)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [2026-08-07] 유튜브 마커도 커밋한다. 이게 빠져 있어서 파이썬이 만든
          # youtube_pub.json 이 러너와 함께 증발했고, 중복 방지 가드가 무효였다 —
          # 같은 날짜로 두 번 돌면 같은 영상이 채널에 두 개 올라간다.
          # add 를 두 줄로 나눈 이유: git add 는 pathspec 하나라도 안 맞으면 통째로
          # 실패해서, 한 줄로 묶으면 유튜브 마커가 없는 날 스레드 마커까지 못 남긴다.
          git add cards/*/threads_pub_*.json 2>/dev/null || true
          git add cards/*/youtube_pub.json 2>/dev/null || true
          git diff --cached --quiet && echo "마커 변경 없음" && exit 0
          git commit -m "chore: 발행 마커 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --autostash origin main || true
          git push

      # [2026-07-27] 주석 대신 **날짜 게이트**로 전환했다.
      # zodiac_instagram.py 의 IG_RESUME_DATE(2026-08-15) 전에는 스스로 SKIP 하고 끝난다.
      # 주석으로 막아두면 해제일에 사람이 기억해서 풀어야 하는데, 그게 잊혀진다.
      # ⚠️ 재개는 캐러셀 하나로 시작한다. 릴스까지 같이 켜면 재개 직후 자동화 신호가
      #    두 배로 뛴다 — 제재 이력이 있는 계정이라 2주 지켜보고 아래 릴스를 켠다.
      - name: 인스타 카드뉴스 캐러셀 발행 (8/15 자동 재개)
        continue-on-error: true
        run: python zodiac_instagram.py carousel

      # - name: 인스타 릴스 영상 발행   ← 캐러셀 2주 무사고 확인 후 해제
      #   continue-on-error: true
      #   run: python zodiac_instagram.py reel
