name: Threads 12띠 저녁 캐러셀

on:
  schedule:
    # 21:10 KST — 다음날 운세 카드. 기존 아침 유령글/낮 띠지목과 분리.
    - cron: '10 12 * * *'
  workflow_dispatch:
    inputs:
      offset_days:
        description: 'KST 기준 발행 대상 오프셋 (0=오늘, 1=내일)'
        required: false
        default: '1'
        type: choice
        options: ['0', '1']
      send:
        description: '실제 Threads 발행'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: threads-zodiac-evening
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      ZODIAC_PUBLISH_OFFSET_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.offset_days || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publish dependency
        run: python -m pip install --disable-pip-version-check -q requests

      - name: Resolve target and preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          DI="$(python - <<'PY'
          import zodiac_seo as zs
          print(zs.target_iso())
          PY
          )"
          echo "date=$DI" >> "$GITHUB_OUTPUT"
          echo "Target: $DI (offset=$ZODIAC_PUBLISH_OFFSET_DAYS)"

          git fetch --quiet --no-tags origin main
          MARKER="cards/$DI/threads_pub_carousel.json"
          if git cat-file -e "origin/main:$MARKER" 2>/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "[SKIP] remote receipt already exists: $MARKER"
            exit 0
          fi
          echo "already=false" >> "$GITHUB_OUTPUT"

          shopt -s nullglob
          cards=(cards/"$DI"/card_*.png cards/"$DI"/card_*.jpg)
          if (( ${#cards[@]} == 0 )); then
            echo "[HOLD] no card assets for $DI"
            exit 2
          fi
          echo "Cards: ${#cards[@]}"

          if [[ -z "${THREADS_ACCESS_TOKEN:-}" || -z "${THREADS_USER_ID:-}" ]]; then
            echo "[HOLD] Threads secret missing"
            exit 3
          fi

      - name: Dry-run safety hold
        if: github.event_name == 'workflow_dispatch' && inputs.send != true && steps.preflight.outputs.already != 'true'
        run: |
          echo "Manual dispatch is dry-run by default. No post sent."
          echo "Target=${{ steps.preflight.outputs.date }}"

      - name: Publish carousel via official Threads API
        if: (github.event_name == 'schedule' || inputs.send == true) && steps.preflight.outputs.already != 'true'
        run: python zodiac_cardnews.py publish

      - name: Persist receipt safely
        if: (github.event_name == 'schedule' || inputs.send == true) && steps.preflight.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DI="${{ steps.preflight.outputs.date }}"
          MARKER="cards/$DI/threads_pub_carousel.json"
          test -s "$MARKER"
          cp "$MARKER" /tmp/threads_pub_carousel.json

          git config user.name "fortune-fanout-bot"
          git config user.email "actions@users.noreply.github.com"

          # Rebase-by-reconstruction: main receives frequent state commits.
          # Never rerun the external publish merely because receipt push races.
          for attempt in 1 2 3; do
            git fetch --quiet --no-tags origin main
            if git cat-file -e "origin/main:$MARKER" 2>/dev/null; then
              echo "Remote receipt already present; done."
              exit 0
            fi
            git reset --hard origin/main
            mkdir -p "cards/$DI"
            cp /tmp/threads_pub_carousel.json "$MARKER"
            git add "$MARKER"
            git commit -m "chore: Threads evening receipt $DI"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying without republishing."
          done
          echo "[FAIL] post was sent but receipt could not be persisted after 3 attempts"
          exit 4
