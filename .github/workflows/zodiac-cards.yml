name: 띠별운세 자동발행 (카드뉴스 + 릴스 · 새벽)

on:
  schedule:
    # 2026-07-21: KST 00:02 → 21:00 으로 이동. 한밝님이 쓰레드를 켜고 있는 저녁 시간대에
    # 발행해야 노출이 잘 됨. 재료(카드+영상)는 전날 18:00 로컬 파이프라인이 이미 push 해둠 →
    # 당일 21시엔 그날치가 이미 존재. GitHub Actions cron 지연 감안 21~22시 실행.
    # (UTC 12:00 = KST 21:00 당일 — TZ=Asia/Seoul 로 날짜를 뽑으므로 날짜 경계 문제 없음)
    - cron: '0 12 * * *'    # KST 21:00
  workflow_dispatch:
    inputs:
      offset_days:
        description: '발행 대상 날짜 오프셋 (0=오늘, 1=내일, 2=모레). 비우면 2'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      # 21시 실행은 '다음날(D+1)' 운세를 올린다 (2026-07-30 한밝님 지시로 D+2 → D+1).
      # 자정이 지나면 그날 운세가 이미 계정에 있고, 계정에 뜬 날짜가 실제 날짜와 하루만
      # 어긋난다. D+2 는 "하루치 여유" 목적이었지만 대가가 컸다 — 21시에 올라간 글이
      # 모레 운세라 독자가 보는 날짜와 이틀 벌어졌고, 7/28~29 push 장애 때는 그 여유가
      # 오히려 '어느 날짜가 비었는지' 파악을 어렵게 했다.
      # 재고 여유는 그대로다: 집PC 파이프라인(18:00)이 D+2 기준으로 만들어 두므로
      # D+1 치는 이미 이틀 전에 생성돼 커밋된 상태다.
      # 수동 실행(workflow_dispatch)에서 offset_days 를 주면 그 값이 우선한다.
      # 예: 오늘치를 메워야 하면 0, 모레치를 미리 올리려면 2.
      ZODIAC_PUBLISH_OFFSET_DAYS: ${{ github.event.inputs.offset_days || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 폰트·ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji ffmpeg

      # 2026-08-05: Supertonic 모델(약 400MB)은 첫 실행에만 받고 이후 캐시를 쓴다.
      # 리포에 넣을 수 없는 크기라(단일 파일 244MB > 100MB 한도) HF에서 받는다.
      - name: Supertonic 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic3-model-v1

      - name: 의존성 설치
        run: |
          pip install requests playwright edge-tts supertonic Pillow
          python -m playwright install --with-deps chromium

      # 2026-07-17: 집 PC 새벽 파이프라인이 Topview GPT Image 2 카드 5장 + 타입캐스트
      # 쇼츠를 미리 커밋해둠 → 있으면 그대로 발행(레거시 생성 건너뜀), 없으면(PC 꺼짐·
      # 생성 실패) 기존 HTML 카드 + Edge TTS 릴스로 폴백 — 발행은 어떤 경우에도 나간다.
      # 2026-08-05 — 카드 생성을 러너 안으로 들여왔다(배경 템플릿 + PIL).
      # 이전에는 집 PC 18시 스케줄이 Topview 로 만들어 커밋해 뒀고 여기서는 건너뛰기만 했다.
      # 이제 이미지 생성 API 를 쓰지 않으므로 러너가 직접 만든다 — 크레딧 0, 집 PC 불필요.
      # 집 PC 가 만들어 둔 재고(png)가 있으면 그대로 존중한다(전환기 안전망).
      - name: 카드 생성 (기존 커밋분 있으면 건너뜀)
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          N=$(ls cards/$TODAY/card_*.png cards/$TODAY/card_*.jpg 2>/dev/null | wc -l)
          if [ "$N" -ge 5 ]; then
            echo "카드 ${N}장 존재 — 생성 건너뜀"
          else
            python zodiac_cardnews_tpl.py generate "$TODAY"
          fi

      - name: 릴스 영상 생성 (커밋분 있으면 건너뜀)
        env:
          # 2026-08-05: 아바타 자산을 avatar/ 에 번들했으므로 러너에서도 켠다.
          # 자산이나 ffmpeg가 없으면 avatar_pip 이 알아서 건너뛰므로 발행은 안 멈춘다.
          ZODIAC_AVATAR: "1"
          SUPERTONIC_VOICE: "M2"
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          if [ -s "reels/${TODAY}_tts.mp4" ]; then
            echo "쇼츠 영상 존재 — 레거시 릴스 생성 건너뜀"
          else
            python zodiac_reels.py generate
          fi

      - name: 커밋 (카드+릴스 public raw 호스팅)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ reels/
          git commit -m "cards+reel $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push

      - name: raw URL 전파 대기
        run: sleep 30

      - name: 스레드 카드뉴스 캐러셀 발행
        continue-on-error: true
        run: python zodiac_cardnews.py publish

      - name: 스레드 릴스 영상 발행
        continue-on-error: true
        run: python zodiac_reels.py publish

      # [2026-07-30] 멱등 마커를 원격에 남긴다.
      # zodiac_cardnews/reels 는 발행 후 cards/{날짜}/threads_pub_*.json 을 쓰고,
      # 다음 실행에서 그 파일이 있으면 스킵한다. 그런데 위의 커밋 스텝은 발행 '전'에만
      # 돌기 때문에 마커가 커밋되지 않았고, runner 는 매번 새로 체크아웃하므로
      # 가드가 사실상 무효였다(원격 마커가 2026-07-21 까지만 남아 있던 이유).
      # 재실행·중복 발행을 진짜로 막으려면 발행 뒤에 한 번 더 커밋해야 한다.
      - name: 발행 마커 커밋 (재실행 중복 방지)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/*/threads_pub_*.json || true
          git diff --cached --quiet && echo "마커 변경 없음" && exit 0
          git commit -m "chore: 발행 마커 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --autostash origin main || true
          git push

      # [2026-07-27] 주석 대신 **날짜 게이트**로 전환했다.
      # zodiac_instagram.py 의 IG_RESUME_DATE(2026-08-15) 전에는 스스로 SKIP 하고 끝난다.
      # 주석으로 막아두면 해제일에 사람이 기억해서 풀어야 하는데, 그게 잊혀진다.
      # ⚠️ 재개는 캐러셀 하나로 시작한다. 릴스까지 같이 켜면 재개 직후 자동화 신호가
      #    두 배로 뛴다 — 제재 이력이 있는 계정이라 2주 지켜보고 아래 릴스를 켠다.
      - name: 인스타 카드뉴스 캐러셀 발행 (8/15 자동 재개)
        continue-on-error: true
        run: python zodiac_instagram.py carousel

      # - name: 인스타 릴스 영상 발행   ← 캐러셀 2주 무사고 확인 후 해제
      #   continue-on-error: true
      #   run: python zodiac_instagram.py reel
