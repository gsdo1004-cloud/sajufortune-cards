name: 띠 지목 데일리 1편 (낮)

# 2026-08-05 — AI 뉴스가 나가던 낮 자리를 이 글로 교체했다.
# 계정 편성: 아침 08시 유령글(오늘 일진) / 낮 띠 지목 / 저녁 21시 카드뉴스·릴스.
# 세 편이 서로 겹치지 않게 아침은 '일진', 낮은 '띠 하나를 생년까지 지목', 저녁은 '12띠 전체'.
#
# 왜 AI 뉴스를 뺐나 — 2026-07-31 실측에서 AI 뉴스 24h 평균 조회가 6회로 운세 카드뉴스(34회)의
# 18% 였다. 운세 계정에 개발자 뉴스가 섞여 주제 신호도 흐려졌다. ai-news.yml 은 지우지 않고
# cron 만 껐다(수동 실행은 가능) — 성과 비교에 쓸 수 있어서다.
on:
  schedule:
    # AI 뉴스가 쓰던 시각을 그대로 물려받는다. 명목 KST 11시 + Actions 실측 지연 2.5~2.8h
    # ≈ KST 12~13시 착지 = 점심 피크. 이 지연폭은 2026-07-31 실측값이다.
    #
    # [2026-08-07] 정각(:00) → :23. 같은 날 유령글이 정각 혼잡으로 통째로 누락된 뒤
    # 세 워크플로 모두 분을 어긋나게 뒀다. 자세한 근거는 zodiac-ghost.yml 주석 참조.
    - cron: '23 2 * * *'    # KST 11:23
    - cron: '53 4 * * *'    # KST 13:53 백업 (멱등 마커로 중복 방지)
  workflow_dispatch:
    inputs:
      date:
        description: '발행 기준일 (YYYY-MM-DD, 비우면 오늘)'
        required: false
        default: ''
      sign:
        description: '띠 지정 (rat/ox/tiger/rabbit/dragon/snake/horse/goat/monkey/rooster/dog/pig). 비우면 날짜로 회전'
        required: false
        default: ''
      dry_run:
        description: 'true 면 문구만 출력하고 발행하지 않음'
        required: false
        default: 'false'

jobs:
  signal:
    runs-on: ubuntu-latest
    # 멱등 마커(threads_pub_signal.json)를 레포에 되돌려 커밋해야 한다.
    # 기본 GITHUB_TOKEN 은 읽기 전용이라 이게 없으면 push 가 403 으로 죽는다.
    permissions:
      contents: write
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 폰트·ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji ffmpeg

      # Supertonic 모델(약 400MB)은 첫 실행에만 받고 이후 캐시를 쓴다 — cards.yml 과 동일
      - name: Supertonic 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic3-model-v1

      # requests(PIL과 함께)는 zodiac_signal_card.py의 Topview GPT Image 2 REST 호출·4중
      # 이미지 검증에 필요하다. 띠 지목은 매일 단일 대본의 카드 2장을 생성하므로 현재 1K 기준
      # 약 0.4 Topview 크레딧/일이 든다(단가 변동 가능).
      - name: 의존성 설치
        run: pip install requests pillow edge-tts supertonic google-api-python-client google-auth-oauthlib google-auth-httplib2

      # 공통 인자를 한 번만 만들어 세 스텝이 같은 날짜·띠를 보게 한다.
      - name: 인자 구성
        id: args
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS ${{ github.event.inputs.date }}"
          fi
          if [ -n "${{ github.event.inputs.sign }}" ]; then
            ARGS="$ARGS --sign ${{ github.event.inputs.sign }}"
          fi
          echo "v=$ARGS" >> $GITHUB_OUTPUT

      # 1단계 — 하루 1개 사주v6 대본의 카드 2장 생성(Topview GPT Image 2가 한글 문구까지 직접 렌더).
      # 인증/잔액/이미지 검증 실패 시 해당 날짜만 기존 PIL 카드로 안전 폴백한다.
      - name: 카드 생성
        env:
          TOPVIEW_UID: ${{ secrets.TOPVIEW_UID }}
          TOPVIEW_API_KEY: ${{ secrets.TOPVIEW_API_KEY }}
        run: python zodiac_signal.py ${{ steps.args.outputs.v }} --prepare

      # 2단계 — 카드를 먼저 밀어넣는다. raw.githubusercontent 가 200 을 줘야 발행이 된다.
      - name: 카드 커밋
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Seoul date +%F)
          # -A로 3~5번 레거시 카드 삭제도 함께 반영해 2장 계약을 원격에 고정한다.
          git add -A -- "cards/${DATE}/signal_*.jpg" "cards/${DATE}/signal_ai_manifest.json"
          git diff --staged --quiet || git commit -m "chore: 띠 지목 카드"
          git pull --rebase --autostash || true
          git push
          sleep 15   # raw 반영 대기

      # 같은 재료(signal_01..02.jpg)로 9:16 쇼츠를 만들어 유튜브 운명과학TV에
      # 예약발행한다. Threads 카드와 유튜브 쇼츠는 별도 대본 2편이 아니라 동일한 하루 1편의
      # 채널별 배포본이다.
      # TTS·아바타는 zodiac_reels.make_reel_tts 재사용이라 띠별 영상과 같은 품질이다.
      - name: 쇼츠 영상 생성 (띠 지목)
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          ZODIAC_AVATAR: "1"
          SUPERTONIC_VOICE: "M2"
        run: |
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Seoul date +%F)
          SIGN="${{ github.event.inputs.sign }}"
          python zodiac_signal_reel.py "$DATE" $SIGN

      - name: 유튜브 예약발행 (운명과학TV · 띠 지목)
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_UNMYEONG: ${{ secrets.YOUTUBE_TOKEN_UNMYEONG }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_UNMYEONG_ENABLED: ${{ vars.YOUTUBE_UNMYEONG_ENABLED }}
        run: |
          if [ "${YOUTUBE_UNMYEONG_ENABLED}" != "1" ]; then
            echo "유튜브 발행 보류 중(YOUTUBE_UNMYEONG_ENABLED != 1) — 건너뜁니다."
            exit 0
          fi
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Seoul date +%F)
          VIDEO="reels/${DATE}_signal.mp4"
          if [ ! -s "$VIDEO" ]; then
            echo "영상 없음($VIDEO) — 유튜브 업로드 건너뜀"; exit 0
          fi
          if [ -f "cards/${DATE}/youtube_pub_signal.json" ]; then
            echo "이미 업로드됨(멱등 가드) — 건너뜀"; exit 0
          fi
          python - "$DATE" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          day = sys.argv[1]
          meta = json.loads((Path("cards") / day / "signal_youtube_meta.json")
                            .read_text(encoding="utf-8"))
          # 잡이 12~13시에 착지하므로 같은 날 18시 공개가 여유 있게 잡힌다.
          r = subprocess.run([sys.executable, "youtube_upload.py",
                              "--file", f"reels/{day}_signal.mp4",
                              "--title", meta["title"],
                              "--description", meta["description"],
                              "--tags", ",".join(meta["tags"]),
                              "--publish-at", f"{day}T18:00:00+09:00",
                              "--slot-hours", "18"])
          if r.returncode == 0:
              p = Path("cards") / day / "youtube_pub_signal.json"
              p.write_text(json.dumps({"uploaded": True}, ensure_ascii=False),
                           encoding="utf-8")
          sys.exit(r.returncode)
          PY

      # Threads VIDEO는 공개 raw URL에서 mp4를 받아간다. 유튜브 예약 업로드가 먼저
      # 성공한 뒤에만 이 파일을 push하며, 아래 gate가 두 Threads 발행의 선행조건이다.
      - name: 쇼츠 원본 커밋·푸시 (Threads VIDEO 준비)
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Seoul date +%F)
          git add -- "reels/${DATE}_signal.mp4" "cards/${DATE}/signal_youtube_meta.json"
          git add -- "cards/${DATE}/youtube_pub_signal.json" 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: 띠 지목 쇼츠 원본"
          git pull --rebase --autostash || true
          git push
          RAW_URL="https://raw.githubusercontent.com/gsdo1004-cloud/sajufortune-cards/main/reels/${DATE}_signal.mp4"
          for TRY in $(seq 1 12); do
            if curl --fail --silent --head "$RAW_URL" >/dev/null; then
              echo "[OK] Threads VIDEO 원본 확인: $RAW_URL"
              break
            fi
            if [ "$TRY" = "12" ]; then
              echo "[FAIL] raw mp4가 공개되지 않아 Threads 발행을 중단: $RAW_URL"
              exit 1
            fi
            sleep 10
          done

      # Threads는 유튜브 예약 성공 여부와 독립적으로 발행한다.
      # 영상은 원본 준비가 실패할 수 있으므로 continue-on-error로 두고, 카드뉴스는 반드시 시도한다.
      - name: Threads 쇼츠 영상 발행
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Seoul date +%F)
          SIGN="${{ github.event.inputs.sign }}"
          python zodiac_signal_reel.py "$DATE" $SIGN --publish-threads

      - name: Threads 카드뉴스 발행
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: python zodiac_signal.py ${{ steps.args.outputs.v }}

      # 발행 마커를 남긴다. 발행 '뒤'에 생기므로 이 스텝은 발행 뒤에 와야 하고,
      # 실패해도 남겨야 하므로 always() 다 — 2026-07-30 에 carousel/reels 가 이걸 놓쳐
      # 마커가 원격에 안 남고 멱등 가드가 무효였던 전례가 있다.
      - name: 발행 마커 커밋
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # [2026-08-07] 줄을 나눈다. git add 는 pathspec 하나라도 안 맞으면 통째로
          # 실패하므로, 한 줄로 묶으면 영상 생성이 실패해 유튜브 마커가 없는 날
          # 스레드 마커까지 못 남긴다 → 재실행 시 스레드 중복 발행.
          # (실측: 한 줄 = 0개 스테이징, 두 줄 = 있는 것만 정상 스테이징)
          git add cards/*/threads_pub_signal.json 2>/dev/null || true
          git add cards/*/threads_pub_signal_video.json 2>/dev/null || true
          git add cards/*/youtube_pub_signal.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: 띠 지목 게시물 발행 마커"
          git pull --rebase --autostash || true
          git push || true
