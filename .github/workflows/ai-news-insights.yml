name: 쓰레드 성과 수집 (측정)

# 발행 잡과 **분리**한다. 측정이 발행을 죽이면 안 되고, 측정만 따로 돌려보고 싶을 때도 있다.
#
# 시각: AI 뉴스는 명목 13시(cron 0 4)지만 Actions 지연으로 실제 KST 15:30 에 나간다.
# 그로부터 약 24시간 뒤에 재려고 cron 0 6(명목 KST 15시)에 둔다. 지연이 얹혀도
# 스크립트가 실제 age_h 를 같이 기록하므로 비교는 age 기준으로 맞춰진다.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true 면 대상만 나열하고 API 를 치지 않음'
        required: false
        default: 'false'

jobs:
  insights:
    runs-on: ubuntu-latest
    # 수집 결과(threads_insights.json)를 레포에 되돌려 커밋해야 다음 실행이 이어서 잰다.
    # 러너는 매번 새 환경이라 커밋하지 않으면 매일 처음부터가 된다.
    permissions:
      contents: write
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: 성과 수집
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python ai_news_insights.py --dry-run
          else
            python ai_news_insights.py
          fi

      - name: 결과 커밋
        # Never persist partial/corrupt results when the collector failed.
        # Dry runs must not modify the repository.
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only collector-owned output; never commit unrelated runner files.
          for f in threads_insights.json threads_account.json reply_targets_auto.txt; do
            if [ -e "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git add -A -- "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "[SKIP] 성과 수집 결과 변경 없음"
            exit 0
          fi
          git commit -m "chore: 쓰레드 성과 수집 $(date -u +%Y-%m-%d)"
          # The collector can leave unrelated working-tree modifications.
          # Rebase on a dirty tree caused the Nov 3 failure. Keep these out of
          # the publication commit and stash them before the safe push/rebase.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Unexpected runner changes detected (filenames only); excluding from metrics commit."
            git status --short
            git stash push --include-untracked -m "insights-runner-uncommitted" --quiet
          fi
          bash scripts/safe_git_push.sh main
