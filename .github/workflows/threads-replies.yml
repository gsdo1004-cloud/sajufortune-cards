name: 스레드 댓글 답글 (반자동)

# ⚠️ 스케줄을 일부러 넣지 않았다. 인스타가 자동 댓글로 제재당한 전례가 있어
#    댓글 답글만큼은 **사람이 눌러서** 돌린다. 초안을 눈으로 보고 나서 보낸다.
#    나중에 초안 품질이 충분히 안정되면 그때 스케줄을 검토한다.
on:
  workflow_dispatch:
    inputs:
      send:
        description: 'true 면 실제 발송. 비워두면 초안만 출력(권장)'
        required: false
        default: 'false'
      limit:
        description: '최대 처리 건수(기본 10)'
        required: false
        default: '10'

jobs:
  replies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_PAID: ${{ secrets.GEMINI_API_KEY_PAID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: 댓글 확인 + 답글 초안
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.send }}" = "true" ]; then
            FLAG="--send"
          fi
          python threads_replies.py --limit "${{ github.event.inputs.limit || 10 }}" $FLAG

      # 발송한 댓글은 기록해 둔다. 러너는 매번 새 환경이라 이게 없으면 같은 댓글에
      # 두 번 답글을 단다(같은 사람에게 두 번 답하면 봇 티가 가장 크게 난다).
      - name: 발송 기록 커밋
        if: github.event.inputs.send == 'true'
        run: |
          if [ -f threads_replied.json ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add threads_replied.json
            git diff --staged --quiet || git commit -m "chore: 스레드 답글 기록"
            git push
          fi
