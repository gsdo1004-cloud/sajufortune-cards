name: TikTok Longform Revenue C-line
on:
  workflow_dispatch:
    inputs:
      date:
        description: Target date YYYY-MM-DD
        required: false
  schedule:
    - cron: '10 5 * * 2,4,0'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TIKTOK_LONGFORM_VOICE: F3
      SUPERTONIC_OFF: '0'
      ZODIAC_AVATAR: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Cache Supertonic
        uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic3-model-v1
      - name: Install Python deps
        run: pip install Pillow edge-tts supertonic
      - name: Build TikTok-only longform
        run: |
          TARGET='${{ inputs.date }}'
          if [ -z "$TARGET" ]; then TARGET=$(TZ=Asia/Seoul date +%F); fi
          python tiktok_longform_revenue.py --date "$TARGET"
          python tiktok_longform_renderer.py --date "$TARGET"
      - name: Commit C-line output only
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tiktok_longform_revenue/
          git diff --cached --quiet && exit 0
          git commit -m "content: TikTok longform C-line"
          git pull --rebase --autostash
          git push
