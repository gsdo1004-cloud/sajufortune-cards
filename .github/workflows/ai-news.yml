name: AI 뉴스 쓰레드 (낮)

# 같은 계정에서 시간대를 나눈다 — 아침 08시 운세 유령글 / 낮 13시 AI 뉴스 /
# 저녁 21시 카드뉴스. 한 계정이 하루 종일 같은 주제만 밀지 않게 하는 배치다.
# 🛑 2026-08-05 자동 발행 중단 — 낮 자리는 zodiac-signal.yml(띠 지목 게시물)이 가져갔다.
#
# 왜 껐나: 2026-07-31 실측에서 AI 뉴스 24h 평균 조회가 6회로 운세 카드뉴스(34회)의 18%
# 였다. 운세 계정에 개발자·IT 뉴스가 섞여 계정 주제 신호도 흐려졌다.
# 코드(ai_news_threads.py·ai_news_card.py)와 이 워크플로는 **지우지 않았다** — 성과 비교와
# 나중 재개를 위해 남긴다. 아래 schedule 블록의 주석을 풀면 그대로 되살아난다.
#
# on:
#   schedule:
#     # 2026-07-31 시각 교정. cron '0 4'(명목 KST 13시)로 뒀는데 **실측 발행이 15:30~15:46**
#     # 이었다 — Actions 지연이 1시간이 아니라 2.5~2.8시간이었다. 쓰레드 피크는
#     # 08~09 / 12~13 / 20~22시라 정확히 비는 시간에 나가고 있었다.
#     # 지연을 빼서 점심 피크(12~13시)에 착지시킨다.
#     - cron: '0 2 * * *'     # 명목 KST 11:00 + 실측 지연 ≈ KST 12~13시 착지
on:
  workflow_dispatch:
    inputs:
      count:
        description: '발행 건수(기본 1)'
        required: false
        default: '1'
      dry_run:
        description: 'true 면 문구만 출력하고 발행하지 않음'
        required: false
        default: 'false'

jobs:
  ai-news:
    runs-on: ubuntu-latest
    # 발행 기록(ai_news_posted.json)을 레포에 되돌려 커밋해야 중복 발행이 안 난다.
    # 기본 GITHUB_TOKEN 은 읽기 전용이라 이게 없으면 push 가 403 으로 죽는다(실측).
    permissions:
      contents: write
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install requests pillow
          # 인포그래픽 카드용 한글 폰트. 러너에는 한글 폰트가 없어 안 깔면 네모로 나온다.
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      # 1단계 — 뉴스 선정 + 인포그래픽 생성(발행하지 않음).
      # 카드를 스레드에 붙이려면 이미지가 **먼저 레포에 올라가 있어야** raw URL 이 산다.
      - name: 뉴스 선정 + 카드 생성
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAG="--dry-run"
          else
            FLAG="--prepare"
          fi
          python ai_news_threads.py --count "${{ github.event.inputs.count || 2 }}" $FLAG

      # 2단계 — 카드를 먼저 올린다. 이게 끝나야 raw URL 이 200 을 준다.
      - name: 카드 커밋
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/ai_news 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: AI 뉴스 인포그래픽"
          git push
          sleep 15   # raw.githubusercontent 반영 대기

      # 3단계 — 실제 발행.
      - name: 스레드 발행
        if: github.event.inputs.dry_run != 'true'
        run: python ai_news_threads.py --publish

      # 같은 기사를 다시 올리지 않도록 발행 기록을 레포에 남긴다.
      # 이게 없으면 러너가 매번 새 환경이라 중복 발행이 난다.
      - name: 발행 기록 커밋
        if: github.event.inputs.dry_run != 'true'
        run: |
          if [ -f ai_news_posted.json ]; then
            git add ai_news_posted.json
            git diff --staged --quiet || git commit -m "chore: AI 뉴스 발행 기록"
            git push
          fi
