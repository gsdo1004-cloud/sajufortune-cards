name: 띠별운세 유령 게시물 (아침)

on:
  schedule:
    # 유령 게시물은 24시간 뒤 사라진다. 아침에 올려 그날 낮 동안 프로필 유입을 만든다.
    #
    # [2026-08-07] 정각(:00) → :23 으로 옮김. 2026-08-07 아침 실행이 통째로 누락됐다.
    # 과거 11회 지연폭이 +49~61분으로 일정했는데 그날은 +119분에도 실행 기록 자체가
    # 없었다 — 지연이 아니라 GitHub 이 예약 이벤트를 버린 것이다. 매시 정각은 전 세계
    # cron 이 몰리는 혼잡 구간이라 지연·누락이 잦다(GitHub 문서에 명시). 분을 어긋나게
    # 두면 확률이 낮아진다. 다만 누락을 완전히 막아주지는 않는다.
    - cron: '23 23 * * *'    # KST 08:23
    - cron: '53 0 * * *'     # KST 09:53 백업 (멱등 마커로 중복 방지)
  push:
    branches: [main]
    paths:
      - '.github/workflows/zodiac-ghost.yml'
      - 'zodiac_ghost.py'
      - 'threads_conversion.py'
  workflow_dispatch:
    inputs:
      date:
        description: '발행 대상 날짜(YYYY-MM-DD). 비우면 오늘'
        required: false
        default: ''
      dry_run:
        description: 'true 면 문구만 출력하고 발행하지 않음'
        required: false
        default: 'false'

jobs:
  ghost:
    runs-on: ubuntu-latest
    # 발행 마커(cards/{날짜}/threads_pub_ghost.json)를 레포에 되돌려 커밋해야 한다.
    # 러너는 매번 새 체크아웃이라 커밋하지 않으면 멱등 가드가 무효가 되고,
    # 성과 측정(ai_news_insights.py)도 유령글 post_id 를 못 찾는다.
    permissions:
      contents: write
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
    steps:
      - name: Threads 토큰 사전검사
        shell: bash
        run: |
          python3 - <<'PYTOKEN'
          import json, os, sys, urllib.parse, urllib.request, urllib.error
          tok=os.environ.get('THREADS_ACCESS_TOKEN','')
          if not tok:
              print('[FAIL] THREADS_ACCESS_TOKEN secret is missing')
              sys.exit(78)
          url='https://graph.threads.net/v1.0/me?' + urllib.parse.urlencode({'fields':'id','access_token':tok})
          try:
              with urllib.request.urlopen(url, timeout=15) as r:
                  data=json.load(r)
              if not data.get('id'):
                  raise RuntimeError('token validation returned no id')
              print('[OK] Threads token valid')
          except urllib.error.HTTPError as e:
              body=e.read().decode('utf-8','replace')[:1500]
              body=body.replace(tok,'[REDACTED]')
              print('[FAIL] Threads token invalid/expired:', body)
              sys.exit(78)
          except Exception as e:
              print('[FAIL] Threads token preflight:', type(e).__name__, str(e)[:500])
              sys.exit(78)
          PYTOKEN

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            zodiac_ghost.py
            zodiac_seo.py
            ganzhi_zodiac.py
            threads_conversion.py
            cards/*/threads_pub_ghost.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: 유령 게시물 발행
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAG="--dry-run"
          fi
          python zodiac_ghost.py ${{ github.event.inputs.date }} $FLAG

      - name: 발행 마커 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/*/threads_pub_ghost.json 2>/dev/null || true
          # "변경 없음"을 문자열로 판정하지 않는다 — exit code 로만 본다.
          if git diff --cached --quiet; then
            echo "새 마커 없음 — 커밋 생략"
          else
            git commit -m "chore: 유령글 발행 마커 $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          fi
