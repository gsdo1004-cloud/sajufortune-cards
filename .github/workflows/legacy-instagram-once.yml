name: Legacy Instagram Once

on:
  workflow_dispatch:
    inputs:
      date:
        description: Target date
        required: true
        default: "2026-10-13"

permissions:
  contents: write

concurrency:
  group: legacy-instagram-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATE: ${{ inputs.date }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_LEGACY_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LEGACY_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_KEY: sajufortune.kr
      INSTAGRAM_EXPECTED_USERNAME: sajufortune.kr
      INSTAGRAM_EXPERIMENT_VARIANT: B
      INSTAGRAM_AUTO_COMMENT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install --quiet requests

      - name: Fail closed if already published
        run: |
          MARKER="cards/${DATE}/instagram_pub_reel_sajufortune_kr.json"
          if [ -f "$MARKER" ]; then
            echo "[STOP] legacy reel marker already exists: $MARKER"
            exit 9
          fi

      - name: Verify source and make B variant
        run: |
          test -s "reels/${DATE}_tts.mp4"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python instagram_reel_variant.py "$DATE" B
          test -s "reels/${DATE}_tts_ig_B.mp4"

      - name: Publish variant to public raw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "reels/${DATE}_tts_ig_B.mp4"
          if git diff --cached --quiet; then
            echo "[SKIP] variant already committed"
          else
            git commit -m "chore: legacy Instagram B variant ${DATE}"
            bash scripts/safe_git_push.sh main
          fi

      - name: Wait for public raw propagation
        run: sleep 30

      - name: Exact account preflight
        run: python zodiac_instagram.py preflight

      - name: Publish legacy Reel only
        run: python zodiac_instagram.py reel "$DATE"

      - name: Verify and commit marker
        run: |
          MARKER="cards/${DATE}/instagram_pub_reel_sajufortune_kr.json"
          test -s "$MARKER"
          python - "$MARKER" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding='utf-8'))
          assert d.get('account_key') == 'sajufortune.kr', d
          assert d.get('experiment_variant') == 'B', d
          assert d.get('post_id'), d
          print(f"[OK] marker account={d['account_key']} variant={d['experiment_variant']} post_id={d['post_id']}")
          PY
          git add "$MARKER"
          git commit -m "chore: record legacy Instagram reel ${DATE}"
          bash scripts/safe_git_push.sh main
