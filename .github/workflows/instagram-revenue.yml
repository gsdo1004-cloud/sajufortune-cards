name: Instagram Revenue Reels

on:
  schedule:
    - cron: '17 6 * * *'    # KST 15:17 - afternoon secondary post
    - cron: '47 6 * * *'    # KST 15:47 - backup; idempotency marker blocks duplicates
    - cron: '17 11 * * *'   # KST 20:17 - next-day today-fortune Reel
    - cron: '47 11 * * *'   # KST 20:47 - backup; idempotency marker blocks duplicates
  workflow_dispatch:
    inputs:
      mode:
        description: 'status | signal | carousel | reel'
        required: false
        default: 'status'
      date:
        description: 'YYYY-MM-DD; blank = KST today'
        required: false
        default: ''
      publish:
        description: 'true only for an intentional manual publish'
        required: false
        default: 'false'
      account:
        description: 'primary | legacy | both'
        required: false
        default: 'primary'

permissions:
  contents: write

concurrency:
  group: instagram-revenue-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INSTAGRAM_AUTO_COMMENT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /analytics/
            /cards/*/instagram_pub_*.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: pip install requests

      - name: Resolve safe publish slot
        id: target
        shell: bash
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          # Scheduled jobs can start hours late. For the fixed 06/11 UTC slots,
          # the UTC calendar date is the intended KST publishing date. Using
          # execution-time KST after midnight can otherwise jump one day ahead.
          SCHEDULE_DATE=$(date -u +%F)
          SCHEDULE_TOMORROW=$(date -u -d "$SCHEDULE_DATE +1 day" +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            DATE="${{ github.event.inputs.date }}"
            [ -z "$DATE" ] && DATE="$TODAY"
          else
            SLOT="${{ github.event.schedule }}"
            case "$SLOT" in
              '17 6 * * *'|'47 6 * * *')
                DOW=$(TZ=Asia/Seoul date +%u)
                case "$DOW" in
                  1|3|5) MODE='signal' ;;
                  2|4|7) MODE='carousel' ;;
                  *) MODE='skip' ;;
                esac
                DATE="$SCHEDULE_DATE"
                ;;
              *)
                MODE='reel'
                DATE="$SCHEDULE_TOMORROW"
                ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Resolve dual-account reel variants
        id: variants
        shell: bash
        run: |
          python - "${{ steps.target.outputs.date }}" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          import instagram_dual_experiment as ide

          plan = ide.plan_for_date(sys.argv[1])
          by_account = {x["account_key"]: x for x in plan["assignments"]}
          print(f"primary_variant={by_account[ide.PRIMARY_ACCOUNT]['variant']}")
          print(f"legacy_variant={by_account[ide.LEGACY_ACCOUNT]['variant']}")
          PY

      - name: Validate Primary Instagram authorization
        if: github.event_name == 'schedule' || github.event.inputs.account == 'primary' || github.event.inputs.account == 'both'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCOUNT_KEY: gsdo10042026
          INSTAGRAM_EXPECTED_USERNAME: gsdo10042026
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.variants.outputs.primary_variant }}
        run: python zodiac_instagram.py preflight

      - name: Validate Legacy Instagram authorization
        if: (github.event_name == 'schedule' && steps.target.outputs.mode == 'reel') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.account == 'legacy' || github.event.inputs.account == 'both'))
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LEGACY_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_LEGACY_USER_ID }}
          INSTAGRAM_ACCOUNT_KEY: sajufortune.kr
          INSTAGRAM_EXPECTED_USERNAME: sajufortune.kr
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.variants.outputs.legacy_variant }}
        run: python zodiac_instagram.py preflight

      - name: Show Primary safe status
        if: github.event_name == 'schedule' || github.event.inputs.account == 'primary' || github.event.inputs.account == 'both'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCOUNT_KEY: gsdo10042026
          INSTAGRAM_EXPECTED_USERNAME: gsdo10042026
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.variants.outputs.primary_variant }}
        run: python zodiac_instagram.py status "${{ steps.target.outputs.date }}"

      - name: Show Legacy safe status
        if: (github.event_name == 'schedule' && steps.target.outputs.mode == 'reel') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.account == 'legacy' || github.event.inputs.account == 'both'))
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LEGACY_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_LEGACY_USER_ID }}
          INSTAGRAM_ACCOUNT_KEY: sajufortune.kr
          INSTAGRAM_EXPECTED_USERNAME: sajufortune.kr
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.variants.outputs.legacy_variant }}
        run: python zodiac_instagram.py status "${{ steps.target.outputs.date }}"

      - name: Publish scheduled Primary Instagram content
        if: github.event_name == 'schedule' && steps.target.outputs.mode != 'skip'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCOUNT_KEY: gsdo10042026
          INSTAGRAM_EXPECTED_USERNAME: gsdo10042026
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.variants.outputs.primary_variant }}
        run: python zodiac_instagram.py "${{ steps.target.outputs.mode }}" "${{ steps.target.outputs.date }}"

      - name: Publish scheduled Legacy Reel
        if: always() && github.event_name == 'schedule' && steps.target.outputs.mode == 'reel'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LEGACY_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_LEGACY_USER_ID }}
          INSTAGRAM_ACCOUNT_KEY: sajufortune.kr
          INSTAGRAM_EXPECTED_USERNAME: sajufortune.kr
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.variants.outputs.legacy_variant }}
        run: python zodiac_instagram.py reel "${{ steps.target.outputs.date }}"

      - name: Publish intentional manual Primary content
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && github.event.inputs.mode != 'status' && (github.event.inputs.account == 'primary' || github.event.inputs.account == 'both')
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCOUNT_KEY: gsdo10042026
          INSTAGRAM_EXPECTED_USERNAME: gsdo10042026
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.variants.outputs.primary_variant }}
        run: python zodiac_instagram.py "${{ github.event.inputs.mode }}" "${{ steps.target.outputs.date }}"

      - name: Publish intentional manual Legacy content
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && github.event.inputs.mode != 'status' && (github.event.inputs.account == 'legacy' || github.event.inputs.account == 'both')
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LEGACY_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_LEGACY_USER_ID }}
          INSTAGRAM_ACCOUNT_KEY: sajufortune.kr
          INSTAGRAM_EXPECTED_USERNAME: sajufortune.kr
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.variants.outputs.legacy_variant }}
        run: python zodiac_instagram.py "${{ github.event.inputs.mode }}" "${{ steps.target.outputs.date }}"

      - name: Collect Primary aggregate insights
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && (github.event.inputs.account == 'primary' || github.event.inputs.account == 'both'))
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCOUNT_KEY: gsdo10042026
          INSTAGRAM_EXPECTED_USERNAME: gsdo10042026
        run: python instagram_insights.py

      - name: Collect Legacy aggregate insights
        if: always() && ((github.event_name == 'schedule' && steps.target.outputs.mode == 'reel') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && (github.event.inputs.account == 'legacy' || github.event.inputs.account == 'both')))
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LEGACY_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_LEGACY_USER_ID }}
          INSTAGRAM_ACCOUNT_KEY: sajufortune.kr
          INSTAGRAM_EXPECTED_USERNAME: sajufortune.kr
        run: python instagram_insights.py

      - name: Persist idempotency markers and aggregate insights
        if: always() && (github.event_name == 'schedule' || github.event.inputs.publish == 'true')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/*/instagram_pub_*.json 2>/dev/null || true
          git add analytics/instagram_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Instagram state changes"
            exit 0
          fi
          git commit -m "chore(instagram): record automated dual-account publish"
          bash scripts/safe_git_push.sh main
