name: 12띠 카드 자산 생성 (무비용·게시 없음)

on:
  schedule:
    - cron: '37 8 * * *'  # KST 17:37: tomorrow's card inventory
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD; blank means tomorrow in KST'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: zodiac-card-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve target date
        id: target
        shell: bash
        env:
          MANUAL_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          DAY="${MANUAL_DATE:-}"
          if [ -z "$DAY" ]; then DAY="$(TZ=Asia/Seoul date -d '+1 day' +%F)"; fi
          python - "$DAY" <<'PY'
          import datetime, sys
          assert datetime.date.fromisoformat(sys.argv[1]).isoformat() == sys.argv[1]
          PY
          echo "date=$DAY" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /assets/bg_sets/
            /assets/fonts/
            /cards/${{ steps.target.outputs.date }}/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free local renderer dependencies
        run: python -m pip install --disable-pip-version-check -q Pillow requests

      - name: Ensure and validate six generated images
        run: python scripts/zodiac_card_assets.py ensure "${{ steps.target.outputs.date }}"

      - name: Upload only verified assets to repository
        shell: bash
        run: |
          set -euo pipefail
          DAY="${{ steps.target.outputs.date }}"
          python scripts/zodiac_card_assets.py verify "$DAY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "cards/$DAY"
          if git diff --cached --quiet; then
            echo "[SKIP] same-date assets already stored"
            exit 0
          fi
          git commit -m "chore(cards): create 12-zodiac images $DAY"
          bash scripts/safe_git_push.sh main
