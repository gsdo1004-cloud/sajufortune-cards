name: 띠별운세 유령 게시물 (아침)

on:
  schedule:
    # 유령 게시물은 24시간 뒤 사라진다. 아침에 올려 그날 낮 동안 프로필 유입을 만든다.
    # GitHub Actions cron 은 0~1시간 지연될 수 있어 08~09시 사이 발행된다.
    - cron: '0 23 * * *'    # KST 08:00
  workflow_dispatch:
    inputs:
      date:
        description: '발행 대상 날짜(YYYY-MM-DD). 비우면 오늘'
        required: false
        default: ''
      dry_run:
        description: 'true 면 문구만 출력하고 발행하지 않음'
        required: false
        default: 'false'

jobs:
  ghost:
    runs-on: ubuntu-latest
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: 유령 게시물 발행
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAG="--dry-run"
          fi
          python zodiac_ghost.py ${{ github.event.inputs.date }} $FLAG
