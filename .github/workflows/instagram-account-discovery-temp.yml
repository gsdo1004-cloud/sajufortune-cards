name: Instagram Account Discovery TEMP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Discover accessible Instagram accounts
        shell: bash
        run: |
          python - <<'PY'
          import os, requests
          tok = os.environ.get('META_TOKEN','').strip()
          if not tok:
              raise SystemExit('TOKEN_MISSING')

          def call(label, url, fields):
              try:
                  r = requests.get(url, params={'fields': fields, 'access_token': tok}, timeout=20)
                  data = r.json()
                  if r.ok:
                      print(f'[{label}] OK')
                      print(data)
                  else:
                      err = data.get('error', {}) if isinstance(data, dict) else {}
                      print(f'[{label}] ERROR code={err.get("code")} type={err.get("type")} message={err.get("message","")[:300]}')
              except Exception as e:
                  print(f'[{label}] ERROR {type(e).__name__}: {str(e)[:300]}')

          call('FB_ME', 'https://graph.facebook.com/me', 'id,name,instagram_business_account{id,username},connected_instagram_account{id,username}')
          call('FB_ACCOUNTS', 'https://graph.facebook.com/me/accounts', 'id,name,instagram_business_account{id,username},connected_instagram_account{id,username}')
          call('IG_ME', 'https://graph.instagram.com/me', 'user_id,username')
          PY