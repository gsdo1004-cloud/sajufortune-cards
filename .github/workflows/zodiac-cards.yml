name: 띠별운세 자동발행 (카드뉴스 + 릴스 · 새벽)

on:
  schedule:
    # 2026-07-21: KST 00:02 → 21:00 으로 이동. 한밝님이 쓰레드를 켜고 있는 저녁 시간대에
    # 발행해야 노출이 잘 됨. 재료(카드+영상)는 전날 18:00 로컬 파이프라인이 이미 push 해둠 →
    # 당일 21시엔 그날치가 이미 존재. GitHub Actions cron 지연 감안 21~22시 실행.
    # (UTC 11:00 = KST 20:00 당일 — TZ=Asia/Seoul 로 날짜를 뽑으므로 날짜 경계 문제 없음)
    #
    # [2026-08-07] 한밝님 지시: '오늘의 운세'는 전날 저녁 20~24시에 올린다.
    # 예정 21:00 일 때 실측 착지가 21:56~23:15 (지연 56분~2h15m) 로 창 상단이 빠듯했다.
    # 지연이 3시간으로만 튀어도 자정을 넘겨 '전날 업로드'가 깨지고, 유튜브 publishAt
    # (D+1 00:00) 도 과거 시각이 돼 즉시 공개로 새어 나간다. 예정을 20:00 으로 당겨
    # 착지를 20:56~22:15 로 만들어 창 한가운데에 놓는다.
    #
    # [2026-08-07] 정각(:00) → :23. 같은 날 유령글이 정각 혼잡으로 통째로 누락된 뒤
    # 세 워크플로 모두 분을 어긋나게 뒀다. 자세한 근거는 zodiac-ghost.yml 주석 참조.
    # 명목 20:23 + 지연이면 착지가 21시 전후 — 20~24시 창 한가운데를 유지한다.
    - cron: '23 11 * * *'    # KST 20:23
    - cron: '53 13 * * *'    # KST 22:53 백업 (멱등 마커로 중복 방지)
  workflow_dispatch:
    inputs:
      offset_days:
        description: '발행 대상 날짜 오프셋 (0=오늘, 1=내일, 2=모레). 비우면 2'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      # 21시 실행은 '다음날(D+1)' 운세를 올린다 (2026-07-30 한밝님 지시로 D+2 → D+1).
      # 자정이 지나면 그날 운세가 이미 계정에 있고, 계정에 뜬 날짜가 실제 날짜와 하루만
      # 어긋난다. D+2 는 "하루치 여유" 목적이었지만 대가가 컸다 — 21시에 올라간 글이
      # 모레 운세라 독자가 보는 날짜와 이틀 벌어졌고, 7/28~29 push 장애 때는 그 여유가
      # 오히려 '어느 날짜가 비었는지' 파악을 어렵게 했다.
      # 재고 여유는 그대로다: 집PC 파이프라인(18:00)이 D+2 기준으로 만들어 두므로
      # D+1 치는 이미 이틀 전에 생성돼 커밋된 상태다.
      # 수동 실행(workflow_dispatch)에서 offset_days 를 주면 그 값이 우선한다.
      # 예: 오늘치를 메워야 하면 0, 모레치를 미리 올리려면 2.
      ZODIAC_PUBLISH_OFFSET_DAYS: ${{ github.event.inputs.offset_days || '1' }}
    steps:
      - name: Threads 토큰 사전검사
        shell: bash
        run: |
          python3 - <<'PYTOKEN'
          import json, os, sys, urllib.parse, urllib.request, urllib.error
          tok=os.environ.get('THREADS_ACCESS_TOKEN','')
          if not tok:
              print('[FAIL] THREADS_ACCESS_TOKEN secret is missing')
              sys.exit(78)
          url='https://graph.threads.net/v1.0/me?' + urllib.parse.urlencode({'fields':'id','access_token':tok})
          try:
              with urllib.request.urlopen(url, timeout=15) as r:
                  data=json.load(r)
              if not data.get('id'):
                  raise RuntimeError('token validation returned no id')
              print('[OK] Threads token valid')
          except urllib.error.HTTPError as e:
              body=e.read().decode('utf-8','replace')[:1500]
              body=body.replace(tok,'[REDACTED]')
              print('[FAIL] Threads token invalid/expired:', body)
              sys.exit(78)
          except Exception as e:
              print('[FAIL] Threads token preflight:', type(e).__name__, str(e)[:500])
              sys.exit(78)
          PYTOKEN

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 폰트·ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji ffmpeg

      - name: Supertonic 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic3-model-v1

      - name: 의존성 설치
        run: |
          pip install requests playwright edge-tts supertonic google-api-python-client google-auth-oauthlib google-auth-httplib2 Pillow
          python -m playwright install --with-deps chromium

      - name: 카드 생성 (기존 커밋분 있으면 건너뜀)
        run: |
          TARGET=$(TZ=Asia/Seoul date -d "+${ZODIAC_PUBLISH_OFFSET_DAYS:-0} days" +%F)
          N=$(ls cards/$TARGET/card_*.png cards/$TARGET/card_*.jpg 2>/dev/null | wc -l)
          if [ "$N" -ge 5 ]; then
            echo "카드 ${N}장 존재($TARGET) — 생성 건너뜀"
          else
            python zodiac_cardnews_tpl.py generate "$TARGET"
          fi

      - name: 릴스 영상 생성 (커밋분 있으면 건너뜀)
        env:
          ZODIAC_AVATAR: "1"
          SUPERTONIC_VOICE: "M2"
        run: |
          TARGET=$(TZ=Asia/Seoul date -d "+${ZODIAC_PUBLISH_OFFSET_DAYS:-0} days" +%F)
          if [ -s "reels/${TARGET}_tts.mp4" ]; then
            echo "쇼츠 영상 존재($TARGET) — 레거시 릴스 생성 건너뜀"
          else
            python zodiac_reels.py generate
          fi

      - name: 커밋 (카드+릴스 public raw 호스팅)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ reels/
          if git diff --cached --quiet; then
            echo "[SKIP] 카드+릴스 변경 없음 — push 생략"
          else
            git commit -m "cards+reel $(TZ=Asia/Seoul date +%F)"
            bash scripts/safe_git_push.sh main
          fi

      - name: raw URL 전파 대기
        run: sleep 30

      - name: 유튜브 예약발행 (운명과학TV)
        id: youtube_reservation
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_UNMYEONG: ${{ secrets.YOUTUBE_TOKEN_UNMYEONG }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_UNMYEONG_ENABLED: ${{ vars.YOUTUBE_UNMYEONG_ENABLED }}
        run: |
          if [ "${YOUTUBE_UNMYEONG_ENABLED}" != "1" ]; then
            echo "유튜브 발행 보류 중(YOUTUBE_UNMYEONG_ENABLED != 1) — 건너뜁니다."
            exit 0
          fi
          OFFSET="${ZODIAC_PUBLISH_OFFSET_DAYS:-0}"
          TODAY=$(TZ=Asia/Seoul date -d "+${OFFSET} days" +%F)
          echo "대상 날짜: $TODAY (offset +${OFFSET})"
          VIDEO="reels/${TODAY}_tts.mp4"
          if [ ! -s "$VIDEO" ]; then
            echo "영상 없음($VIDEO) — 유튜브 업로드 건너뜀"; exit 0
          fi
          if [ -f "cards/${TODAY}/uploaded.json" ] || [ -f "cards/${TODAY}/youtube_pub.json" ]; then
            echo "이미 업로드됨(멱등 가드) — 건너뜀"; exit 0
          fi
          python - "$TODAY" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          import zodiac_reels as zr
          day = sys.argv[1]
          m = zr.youtube_meta(day)
          from datetime import date, timedelta
          publish_day = date.fromisoformat(day) - timedelta(days=1)
          r = subprocess.run([sys.executable, "youtube_upload.py",
                              "--file", f"reels/{day}_tts.mp4",
                              "--title", m["title"],
                              "--description", m["description"],
                              "--tags", ",".join(m["tags"]),
                              "--publish-at", f"{publish_day}T21:00:00+09:00",
                              "--slot-hours", "0"])
          if r.returncode == 0:
              p = Path("cards") / day / "youtube_pub.json"
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps({"uploaded": True}, ensure_ascii=False), encoding="utf-8")
          sys.exit(r.returncode)
          PY

      - name: 스레드 저녁 1편 발행 (캐러셀/릴스 교대)
        continue-on-error: true
        run: |
          OFFSET="${ZODIAC_PUBLISH_OFFSET_DAYS:-0}"
          TARGET=$(TZ=Asia/Seoul date -d "+${OFFSET} days" +%F)
          ORD=$(TZ=Asia/Seoul date -d "$TARGET" +%j)
          if [ $((10#$ORD % 2)) -eq 0 ]; then
            echo "${TARGET}: 캐러셀 발행"
            python zodiac_cardnews.py publish
          else
            echo "${TARGET}: 릴스 발행"
            python zodiac_reels.py publish
          fi

      - name: 발행 마커 커밋 (재실행 중복 방지)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/*/threads_pub_*.json 2>/dev/null || true
          git add cards/*/youtube_pub.json 2>/dev/null || true
          git diff --cached --quiet && echo "마커 변경 없음" && exit 0
          git commit -m "chore: 발행 마커 $(TZ=Asia/Seoul date +%F)"
          bash scripts/safe_git_push.sh main

      # [2026-10-13] Instagram 두 계정 교차 실험.
      # gsdo10042026는 기존 Secrets를 쓰고, sajufortune.kr은 Legacy Secrets가 있을 때만 발행한다.
      - name: Instagram 2계정 교차 계획
        id: ig_ab
        shell: bash
        run: |
          TARGET=$(TZ=Asia/Seoul date -d "+${ZODIAC_PUBLISH_OFFSET_DAYS:-0} days" +%F)
          python - "$TARGET" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          import instagram_dual_experiment as ide
          plan = ide.plan_for_date(sys.argv[1])
          by_slot = {x["slot"]: x for x in plan["assignments"]}
          print(f"target_date={sys.argv[1]}")
          for slot in ("early", "late"):
              item = by_slot[slot]
              print(f"{slot}_account={item['account_key']}")
              print(f"{slot}_variant={item['variant']}")
          PY

      - name: Instagram early 사전검사 — gsdo10042026
        id: ig_early_primary
        if: steps.ig_ab.outputs.early_account == 'gsdo10042026'
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_KEY: gsdo10042026
          INSTAGRAM_EXPECTED_USERNAME: gsdo10042026
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.ig_ab.outputs.early_variant }}
          INSTAGRAM_AUTO_COMMENT: "0"
        run: python zodiac_instagram.py preflight

      - name: Instagram early 사전검사 — sajufortune.kr
        id: ig_early_legacy
        if: steps.ig_ab.outputs.early_account == 'sajufortune.kr'
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_LEGACY_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LEGACY_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_KEY: sajufortune.kr
          INSTAGRAM_EXPECTED_USERNAME: sajufortune.kr
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.ig_ab.outputs.early_variant }}
          INSTAGRAM_AUTO_COMMENT: "0"
        run: python zodiac_instagram.py preflight

      - name: Instagram early Reel — gsdo10042026
        if: steps.ig_ab.outputs.early_account == 'gsdo10042026' && steps.ig_early_primary.outcome == 'success'
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_KEY: gsdo10042026
          INSTAGRAM_EXPECTED_USERNAME: gsdo10042026
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.ig_ab.outputs.early_variant }}
          INSTAGRAM_AUTO_COMMENT: "0"
        run: python zodiac_instagram.py reel

      - name: Instagram early Reel — sajufortune.kr
        if: steps.ig_ab.outputs.early_account == 'sajufortune.kr' && steps.ig_early_legacy.outcome == 'success'
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_LEGACY_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LEGACY_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_KEY: sajufortune.kr
          INSTAGRAM_EXPECTED_USERNAME: sajufortune.kr
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.ig_ab.outputs.early_variant }}
          INSTAGRAM_AUTO_COMMENT: "0"
        run: python zodiac_instagram.py reel

      - name: Instagram early 인사이트 — gsdo10042026
        if: always() && steps.ig_ab.outputs.early_account == 'gsdo10042026' && steps.ig_early_primary.outcome == 'success'
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_KEY: gsdo10042026
          INSTAGRAM_EXPECTED_USERNAME: gsdo10042026
        run: python instagram_insights.py

      - name: Instagram early 인사이트 — sajufortune.kr
        if: always() && steps.ig_ab.outputs.early_account == 'sajufortune.kr' && steps.ig_early_legacy.outcome == 'success'
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_LEGACY_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LEGACY_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_KEY: sajufortune.kr
          INSTAGRAM_EXPECTED_USERNAME: sajufortune.kr
        run: python instagram_insights.py

      - name: Instagram 두 번째 슬롯 간격
        if: always()
        run: sleep 300

      - name: Instagram late 사전검사 — gsdo10042026
        id: ig_late_primary
        if: steps.ig_ab.outputs.late_account == 'gsdo10042026'
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_KEY: gsdo10042026
          INSTAGRAM_EXPECTED_USERNAME: gsdo10042026
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.ig_ab.outputs.late_variant }}
          INSTAGRAM_AUTO_COMMENT: "0"
        run: python zodiac_instagram.py preflight

      - name: Instagram late 사전검사 — sajufortune.kr
        id: ig_late_legacy
        if: steps.ig_ab.outputs.late_account == 'sajufortune.kr'
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_LEGACY_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LEGACY_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_KEY: sajufortune.kr
          INSTAGRAM_EXPECTED_USERNAME: sajufortune.kr
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.ig_ab.outputs.late_variant }}
          INSTAGRAM_AUTO_COMMENT: "0"
        run: python zodiac_instagram.py preflight

      - name: Instagram late Reel — gsdo10042026
        if: steps.ig_ab.outputs.late_account == 'gsdo10042026' && steps.ig_late_primary.outcome == 'success'
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_KEY: gsdo10042026
          INSTAGRAM_EXPECTED_USERNAME: gsdo10042026
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.ig_ab.outputs.late_variant }}
          INSTAGRAM_AUTO_COMMENT: "0"
        run: python zodiac_instagram.py reel

      - name: Instagram late Reel — sajufortune.kr
        if: steps.ig_ab.outputs.late_account == 'sajufortune.kr' && steps.ig_late_legacy.outcome == 'success'
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_LEGACY_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LEGACY_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_KEY: sajufortune.kr
          INSTAGRAM_EXPECTED_USERNAME: sajufortune.kr
          INSTAGRAM_EXPERIMENT_VARIANT: ${{ steps.ig_ab.outputs.late_variant }}
          INSTAGRAM_AUTO_COMMENT: "0"
        run: python zodiac_instagram.py reel

      - name: Instagram late 인사이트 — gsdo10042026
        if: always() && steps.ig_ab.outputs.late_account == 'gsdo10042026' && steps.ig_late_primary.outcome == 'success'
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_KEY: gsdo10042026
          INSTAGRAM_EXPECTED_USERNAME: gsdo10042026
        run: python instagram_insights.py

      - name: Instagram late 인사이트 — sajufortune.kr
        if: always() && steps.ig_ab.outputs.late_account == 'sajufortune.kr' && steps.ig_late_legacy.outcome == 'success'
        continue-on-error: true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_LEGACY_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_LEGACY_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_KEY: sajufortune.kr
          INSTAGRAM_EXPECTED_USERNAME: sajufortune.kr
        run: python instagram_insights.py

      - name: Instagram 24h·72h 계정 승자 판정
        if: always()
        continue-on-error: true
        run: python instagram_account_winner.py

      - name: Instagram 마커·인사이트 커밋
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/*/instagram_pub_*.json 2>/dev/null || true
          git add analytics/instagram_*.json 2>/dev/null || true
          git diff --cached --quiet && echo "Instagram 변경 없음" && exit 0
          git commit -m "chore: instagram dual-account markers+insights $(TZ=Asia/Seoul date +%F)"
          bash scripts/safe_git_push.sh main
