name: Threads 12띠 저녁 캐러셀

# Approved exception to the manual-reply policy: one scheduled daily fortune carousel only.
# No automated replies/comments are permitted in this workflow.

on:
  schedule:
    # 21:10 KST — 다음날 운세 카드. 기존 아침 유령글/낮 띠지목과 분리.
    - cron: '10 12 * * *'
  workflow_dispatch:
    inputs:
      offset_days:
        description: 'KST 기준 발행 대상 오프셋 (0=오늘, 1=내일)'
        required: false
        default: '1'
        type: choice
        options: ['0', '1']
      date:
        description: 'YYYY-MM-DD; blank = calculated date (manual recovery only)'
        required: false
        default: ''
        type: string
      send:
        description: '실제 Threads 발행'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: threads-zodiac-evening
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_CARDNEWS_AUTO_REPLY: "0"
      THREADS_CARD_ASSET_MODE: isolated_v1
      ZODIAC_PUBLISH_OFFSET_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.offset_days || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /config/
            /assets/bg_sets/
            /assets/fonts/
            /cards/*/threads_pub_carousel.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publish dependency
        run: python -m pip install --disable-pip-version-check -q requests Pillow

      - name: Resolve target and preflight
        id: preflight
        shell: bash
        env:
          MANUAL_TARGET_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          DI="$(python - <<'PY'
          import datetime as dt
          import os
          import zodiac_seo as zs

          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              # This is an evening KST schedule. GitHub can delay cron runs by hours;
              # if it starts before 21:00 KST, keep the previous
              # evening as the base day so "next day" does not jump by two days.
              base = dt.datetime.now(dt.timezone.utc) + dt.timedelta(hours=9)
              if base.hour < 21:
                  base -= dt.timedelta(days=1)
              try:
                  offset = int(os.environ.get("ZODIAC_PUBLISH_OFFSET_DAYS", "1"))
              except ValueError:
                  offset = 1
              print((base.date() + dt.timedelta(days=offset)).isoformat())
          else:
              manual = os.environ.get("MANUAL_TARGET_DATE", "").strip()
              if manual:
                  dt.date.fromisoformat(manual)
                  print(manual)
              else:
                  print(zs.target_iso())
          PY
          )"
          echo "date=$DI" >> "$GITHUB_OUTPUT"
          echo "ZODIAC_TARGET_DATE=$DI" >> "$GITHUB_ENV"
          echo "Target: $DI (offset=$ZODIAC_PUBLISH_OFFSET_DAYS)"

          git fetch --quiet --no-tags origin main
          MARKER="cards/$DI/threads_pub_carousel.json"
          if git cat-file -e "origin/main:$MARKER" 2>/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "[SKIP] remote receipt already exists: $MARKER"
            exit 0
          fi
          echo "already=false" >> "$GITHUB_OUTPUT"
          if git cat-file -e 'origin/main:scripts/zodiac_publish_guard.py' 2>/dev/null; then
            echo "[HOLD] signed release guard requires integrated publisher"
            exit 4
          fi
          git sparse-checkout add "/cards/$DI/" "/assets/flux_daily/$DI/" "/threads_cards/$DI/"

          if [[ -z "${THREADS_ACCESS_TOKEN:-}" || -z "${THREADS_USER_ID:-}" ]]; then
            echo "[HOLD] Threads secret missing"
            exit 3
          fi

      # Separate reviewed asset lane: never replace canonical PNG/JPEG cards.
      - name: Prepare reviewed Threads-only assets without paid API
        if: steps.preflight.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DI="$ZODIAC_TARGET_DATE"
          python scripts/threads_card_assets.py prepare "$DI"
          python scripts/threads_card_assets.py verify "$DI"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "threads_cards/$DI/card_"* "threads_cards/$DI/manifest.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore(threads): isolated verified carousel assets $DI"
            bash scripts/safe_git_push.sh main
          fi
          git fetch --quiet --no-tags origin main
          PIN="$(git rev-parse origin/main)"
          if git cat-file -e "$PIN:scripts/zodiac_publish_guard.py" 2>/dev/null; then
            echo "[HOLD] signed release guard requires integrated publisher"
            exit 4
          fi
          git cat-file -e "$PIN:threads_cards/$DI/manifest.json"
          echo "THREADS_CARD_ASSET_COMMIT=$PIN" >> "$GITHUB_ENV"

      - name: Validate public carousel assets (no publish)
        if: steps.preflight.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Raw hosting can lag behind a successful Git push.
          for attempt in 1 2 3 4 5 6; do
            if python zodiac_cardnews.py check; then exit 0; fi
            echo "[WAIT] public CDN propagation attempt $attempt/6"
            sleep 10
          done
          echo "[HOLD] public cards not verified; no external post"
          exit 1

      - name: Dry-run safety hold
        if: github.event_name == 'workflow_dispatch' && inputs.send != true && steps.preflight.outputs.already != 'true'
        run: |
          echo "Manual dispatch is dry-run by default. No post sent."
          echo "Target=${{ steps.preflight.outputs.date }}"

      - name: Publish carousel via official Threads API
        env:
          CAROUSEL_GITHUB_TOKEN: ${{ github.token }}
        if: (github.event_name == 'schedule' || inputs.send == true) && steps.preflight.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin main
          if git cat-file -e 'origin/main:scripts/zodiac_publish_guard.py' 2>/dev/null; then
            echo "[HOLD] signed release guard requires integrated publisher"
            exit 4
          fi
          if git cat-file -e "origin/main:cards/$ZODIAC_TARGET_DATE/threads_pub_carousel.json" 2>/dev/null; then
            echo "[HOLD] remote receipt appeared; no second publish"
            exit 5
          fi
          # Atomic create-only claim on main BEFORE any external publication.
          # Never remove a claim automatically: a failed response may hide a successful post.
          CLAIM="cards/$ZODIAC_TARGET_DATE/social_claim_threads_carousel.json"
          if git cat-file -e "origin/main:$CLAIM" 2>/dev/null; then
            echo "[HOLD] durable carousel claim exists; reconcile before retry"
            exit 5
          fi
          export CLAIM
          python - <<'PYCLAIM'
          import base64, json, os, requests
          body = dict(state="PUBLISHING", date=os.environ["ZODIAC_TARGET_DATE"], kind="threads_carousel", run_id=os.environ["GITHUB_RUN_ID"])
          response = requests.put("https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/contents/" + os.environ["CLAIM"], headers={"Authorization": "Bearer " + os.environ["CAROUSEL_GITHUB_TOKEN"]}, json={"branch":"main", "message":"chore: claim Threads carousel " + body["date"], "content":base64.b64encode(json.dumps(body).encode()).decode()}, timeout=30)
          if response.status_code != 201:
              raise SystemExit(f"[HOLD] durable claim not created: HTTP {response.status_code}")
          PYCLAIM
          python zodiac_cardnews.py publish

      - name: Persist receipt safely
        if: (github.event_name == 'schedule' || inputs.send == true) && steps.preflight.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DI="${{ steps.preflight.outputs.date }}"
          MARKER="cards/$DI/threads_pub_carousel.json"
          test -s "$MARKER"
          cp "$MARKER" /tmp/threads_pub_carousel.json

          git config user.name "fortune-fanout-bot"
          git config user.email "actions@users.noreply.github.com"

          # Rebase-by-reconstruction: main receives frequent state commits.
          # Never rerun the external publish merely because receipt push races.
          for attempt in 1 2 3; do
            git fetch --quiet --no-tags origin main
            if git cat-file -e "origin/main:$MARKER" 2>/dev/null; then
              echo "Remote receipt already present; done."
              exit 0
            fi
            git reset --hard origin/main
            mkdir -p "cards/$DI"
            cp /tmp/threads_pub_carousel.json "$MARKER"
            git add "$MARKER"
            git commit -m "chore: Threads evening receipt $DI"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying without republishing."
          done
          echo "[FAIL] post was sent but receipt could not be persisted after 3 attempts"
          exit 4
