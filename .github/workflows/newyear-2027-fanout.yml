name: 2027 신년운세 추가 발행 (Shorts)

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'KST 발행 날짜 YYYY-MM-DD'
        required: true
        type: string
      send:
        description: '실제 원격 발행'
        required: true
        default: false
        type: boolean
      mode:
        description: 'normal / youtube_private_canary'
        required: true
        default: normal
        type: choice
        options:
          - normal
          - youtube_private_canary
      source_url:
        description: '로컬 Naver PUBLISHED/RSS 게이트가 확인한 URL'
        required: true
        type: string
      expires_at:
        description: 'HMAC 발행허가 만료시각 ISO-8601 UTC'
        required: true
        type: string
      payload_sha256:
        description: '승인된 전체 발행 manifest item SHA-256'
        required: true
        type: string
      commit_sha:
        description: '승인된 실행 main commit SHA'
        required: true
        type: string
      permit:
        description: '로컬 소스게이트 HMAC 발행허가'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: newyear-2027-fanout-${{ inputs.date }}
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ inputs.send == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.pin.outputs.commit_sha }}
    env:
      TARGET_DATE: ${{ inputs.date }}
      AUTH_MODE: ${{ inputs.mode }}
      SOURCE_URL_INPUT: ${{ inputs.source_url }}
      EXPIRES_AT_INPUT: ${{ inputs.expires_at }}
      PAYLOAD_SHA256_INPUT: ${{ inputs.payload_sha256 }}
      COMMIT_SHA_INPUT: ${{ inputs.commit_sha }}
      DISPATCH_PERMIT_INPUT: ${{ inputs.permit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 검증 대상 commit 고정
        id: pin
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [ "$ACTUAL_SHA" = "$COMMIT_SHA_INPUT" ] || { echo "[FAIL] signed commit mismatch" >&2; exit 78; }
          echo "commit_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
      - name: 로컬 Naver 발행확인 HMAC·시간창 검증
        env:
          NEWYEAR_2027_DISPATCH_KEY: ${{ secrets.NEWYEAR_2027_DISPATCH_KEY }}
        run: |
          python newyear_2027_runner.py verify-permit \
            --date "$TARGET_DATE" \
            --source-url "$SOURCE_URL_INPUT" \
            --mode "$AUTH_MODE" \
            --expires-at "$EXPIRES_AT_INPUT" \
            --payload-sha256 "$PAYLOAD_SHA256_INPUT" \
            --commit-sha "$COMMIT_SHA_INPUT" \
            --permit "$DISPATCH_PERMIT_INPUT"

  youtube:
    needs: gate
    if: ${{ always() && needs.gate.result == 'success' && inputs.send == true && (inputs.mode == 'normal' || inputs.mode == 'youtube_private_canary') }}
    runs-on: ubuntu-latest
    env:
      TARGET_DATE: ${{ inputs.date }}
      AUTH_MODE: ${{ inputs.mode }}
      SOURCE_URL_INPUT: ${{ inputs.source_url }}
      EXPIRES_AT_INPUT: ${{ inputs.expires_at }}
      PAYLOAD_SHA256_INPUT: ${{ inputs.payload_sha256 }}
      COMMIT_SHA_INPUT: ${{ inputs.commit_sha }}
      DISPATCH_PERMIT_INPUT: ${{ inputs.permit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 폰트·ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Supertonic 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic3-model-v1
      - name: Shorts/YouTube 의존성
        run: pip install Pillow edge-tts supertonic google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: YouTube receipt 상태 확인
        id: youtube_state
        run: |
          PLATFORM=youtube
          if [ "$AUTH_MODE" = 'youtube_private_canary' ]; then PLATFORM=youtube_canary; fi
          python newyear_2027_runner.py state \
            --date "$TARGET_DATE" --platform "$PLATFORM" \
            --github-output "$GITHUB_OUTPUT"
      - name: 2027 Shorts 렌더
        if: ${{ steps.youtube_state.outputs.action == 'continue' }}
        env:
          SUPERTONIC_VOICE: M2
        run: python newyear_2027_runner.py render --date "$TARGET_DATE"
      - name: YouTube intent 전 허가 재검증
        if: ${{ steps.youtube_state.outputs.action == 'continue' }}
        env:
          NEWYEAR_2027_DISPATCH_KEY: ${{ secrets.NEWYEAR_2027_DISPATCH_KEY }}
        run: |
          python newyear_2027_runner.py verify-permit \
            --date "$TARGET_DATE" --source-url "$SOURCE_URL_INPUT" \
            --mode "$AUTH_MODE" --expires-at "$EXPIRES_AT_INPUT" \
            --payload-sha256 "$PAYLOAD_SHA256_INPUT" --commit-sha "$COMMIT_SHA_INPUT" \
            --permit "$DISPATCH_PERMIT_INPUT"
      - name: YouTube PUBLISHING intent 생성
        id: youtube_intent
        if: ${{ steps.youtube_state.outputs.action == 'continue' }}
        run: |
          PLATFORM=youtube
          if [ "$AUTH_MODE" = 'youtube_private_canary' ]; then PLATFORM=youtube_canary; fi
          python newyear_2027_runner.py intent \
            --date "$TARGET_DATE" --platform "$PLATFORM" --account '운명과학TV' \
            --video "newyear_2027/rendered/$TARGET_DATE.mp4" --github-output "$GITHUB_OUTPUT"
      - name: YouTube intent 영구 저장 (격리 worktree)
        if: ${{ steps.youtube_intent.outputs.action == 'publish' }}
        run: |
          PLATFORM=youtube
          if [ "$AUTH_MODE" = 'youtube_private_canary' ]; then PLATFORM=youtube_canary; fi
          bash scripts/persist_newyear_2027_receipt.sh claim \
            "newyear_2027/receipts/$TARGET_DATE/$PLATFORM.json" \
            "ny2027 $PLATFORM intent $TARGET_DATE"
      - name: YouTube 발행 직전 허가 재검증
        if: ${{ steps.youtube_intent.outputs.action == 'publish' }}
        env:
          NEWYEAR_2027_DISPATCH_KEY: ${{ secrets.NEWYEAR_2027_DISPATCH_KEY }}
        run: |
          python newyear_2027_runner.py verify-permit \
            --date "$TARGET_DATE" --source-url "$SOURCE_URL_INPUT" \
            --mode "$AUTH_MODE" --expires-at "$EXPIRES_AT_INPUT" \
            --payload-sha256 "$PAYLOAD_SHA256_INPUT" --commit-sha "$COMMIT_SHA_INPUT" \
            --permit "$DISPATCH_PERMIT_INPUT"
      - name: YouTube durable claim 소유권 확인
        if: ${{ steps.youtube_intent.outputs.action == 'publish' }}
        run: |
          PLATFORM=youtube
          if [ "$AUTH_MODE" = 'youtube_private_canary' ]; then PLATFORM=youtube_canary; fi
          bash scripts/verify_newyear_2027_receipt_owner.sh "newyear_2027/receipts/$TARGET_DATE/$PLATFORM.json"
      - name: YouTube 정상 예약발행
        if: ${{ steps.youtube_intent.outputs.action == 'publish' && inputs.mode == 'normal' }}
        env:
          NEWYEAR_2027_DISPATCH_KEY: ${{ secrets.NEWYEAR_2027_DISPATCH_KEY }}
          YOUTUBE_TOKEN_UNMYEONG: ${{ secrets.YOUTUBE_TOKEN_UNMYEONG }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_EXPECT_CHANNEL: 운명과학TV
          YOUTUBE_EXPECT_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECT_CHANNEL_ID }}
        run: python newyear_2027_runner.py publish-youtube --date "$TARGET_DATE" --publish-at "${TARGET_DATE}T15:30:00+09:00"
      - name: YouTube 진짜 비공개 canary (자동 승격 없음)
        if: ${{ steps.youtube_intent.outputs.action == 'publish' && inputs.mode == 'youtube_private_canary' }}
        env:
          NEWYEAR_2027_DISPATCH_KEY: ${{ secrets.NEWYEAR_2027_DISPATCH_KEY }}
          YOUTUBE_TOKEN_UNMYEONG: ${{ secrets.YOUTUBE_TOKEN_UNMYEONG }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_EXPECT_CHANNEL: 운명과학TV
          YOUTUBE_EXPECT_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECT_CHANNEL_ID }}
        run: python newyear_2027_runner.py publish-youtube --date "$TARGET_DATE" --canary
      - name: YouTube PUBLISHED receipt 저장 (격리 worktree)
        if: ${{ steps.youtube_intent.outputs.action == 'publish' }}
        run: |
          PLATFORM=youtube
          if [ "$AUTH_MODE" = 'youtube_private_canary' ]; then PLATFORM=youtube_canary; fi
          bash scripts/persist_newyear_2027_receipt.sh finalize \
            "newyear_2027/receipts/$TARGET_DATE/$PLATFORM.json" \
            "ny2027 $PLATFORM published $TARGET_DATE"
